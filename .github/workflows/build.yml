name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Embed build number and repository (used by in-app updates)
        run: sed -i "s/__BUILD__/${{ github.run_number }}/g; s#__REPO__#${{ github.repository }}#g" www/index.html
      - run: npm install --legacy-peer-deps
      - run: npx cap add android
      - name: Purple app icon (recolor the default Capacitor icon)
        continue-on-error: true
        run: |
          python3 - <<'PYI'
          import os,re,glob,colorsys
          H=263/360.0
          def rot(r,g,b):
              h,sat,v=colorsys.rgb_to_hsv(r/255.0,g/255.0,b/255.0)
              if sat<0.12: return r,g,b
              nr,ng,nb=colorsys.hsv_to_rgb(H,min(1.0,sat*1.05),v)
              return round(nr*255),round(ng*255),round(nb*255)
          res='android/app/src/main/res'
          def fix_xml(p):
              t=open(p,encoding='utf-8').read()
              def sub(m):
                  d=m.group(1)
                  a,c=(d[:2],d[2:]) if len(d)==8 else ('',d)
                  r,g,b=rot(int(c[0:2],16),int(c[2:4],16),int(c[4:6],16))
                  return '#%s%02X%02X%02X'%(a,r,g,b)
              n=re.sub(r'#([0-9A-Fa-f]{8}|[0-9A-Fa-f]{6})\b',sub,t)
              if n!=t:
                  open(p,'w',encoding='utf-8').write(n); print('recolored',p)
          for p in glob.glob(res+'/**/ic_launcher*.xml',recursive=True): fix_xml(p)
          try:
              try:
                  from PIL import Image
              except ImportError:
                  os.system('python3 -m pip install --quiet --break-system-packages pillow || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil)')
                  from PIL import Image
              for p in glob.glob(res+'/**/ic_launcher*.png',recursive=True):
                  im=Image.open(p).convert('RGBA'); px=im.load(); w,h=im.size
                  for yy in range(h):
                      for xx in range(w):
                          r,g,b,a=px[xx,yy]
                          if a: px[xx,yy]=rot(r,g,b)+(a,)
                  im.save(p); print('recolored',p)
          except Exception as e:
              print('PNG icons left unchanged:',e)
          PYI
      - name: Notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M11,3h2v9.2l3.3,-3.3 1.4,1.4L12,16 6.3,10.3l1.4,-1.4L11,12.2zM5,18h14v2H5z"/></vector>
          XML
      - name: Android manifest
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          if 'xmlns:tools' not in s:
              s=s.replace('<manifest ','<manifest xmlns:tools="http://schemas.android.com/tools" ',1)
          for P in ['POST_NOTIFICATIONS','REQUEST_INSTALL_PACKAGES','FOREGROUND_SERVICE','FOREGROUND_SERVICE_DATA_SYNC','WAKE_LOCK']:
              if 'android.permission.'+P+'"' not in s:
                  s=s.replace('</manifest>','    <uses-permission android:name="android.permission.'+P+'" />\n</manifest>')
          svc='<service android:name="ar.com.anura.plugins.backgroundmode.BackgroundModeService" android:foregroundServiceType="dataSync" tools:node="merge" />'
          if 'BackgroundModeService' not in s:
              s=s.replace('</application>','    '+svc+'\n    </application>')
          open(p,'w').write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
      - name: Share / Open-with receiver (HTML and ZIP files sent from other apps)
        run: |
          D=android/app/src/main/java/com/uploader/app
          mkdir -p "$D"
          cp native/MainActivity.java native/ShareReceiverPlugin.java "$D/"
          python3 - <<'PY2'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          if 'android.intent.action.SEND' not in s:
              T=['application/zip','application/x-zip-compressed','application/x-zip']
              H=['text/html','application/xhtml+xml']
              send=''.join('            <data android:mimeType="%s" />\n'%m for m in T+H+['application/octet-stream','text/plain'])
              view=''.join('            <data android:mimeType="%s" />\n'%m for m in T+H)
              f=('        <intent-filter>\n            <action android:name="android.intent.action.SEND" />\n'
                 '            <category android:name="android.intent.category.DEFAULT" />\n'+send+'        </intent-filter>\n'
                 '        <intent-filter>\n            <action android:name="android.intent.action.SEND_MULTIPLE" />\n'
                 '            <category android:name="android.intent.category.DEFAULT" />\n'
                 '            <data android:mimeType="*/*" />\n        </intent-filter>\n'
                 '        <intent-filter>\n            <action android:name="android.intent.action.VIEW" />\n'
                 '            <category android:name="android.intent.category.DEFAULT" />\n'
                 '            <category android:name="android.intent.category.BROWSABLE" />\n'
                 '            <data android:scheme="content" />\n            <data android:scheme="file" />\n'+view+'        </intent-filter>\n')
              s=s.replace('</activity>',f+'    </activity>',1)
          open(p,'w').write(s)
          PY2
          cat android/app/src/main/AndroidManifest.xml
      - name: Version code (always increasing, so updates install over the old app)
        run: |
          VC=$(( $(date +%s) / 60 ))
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2; do
            ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"
            [ "${PIPESTATUS[0]}" -eq 0 ] && exit 0
            echo "Build attempt $i failed"; sleep 5
          done
          MSG=$(grep -E "error:|What went wrong|Execution failed|Could not|licen|AAPT|FAILURE" -A3 "$RUNNER_TEMP/gradle.log" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          echo "::error title=Gradle build failed::$MSG"
          exit 1
      - name: Name the APK after the project
        run: |
          NAME=$(basename "$GITHUB_REPOSITORY")
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME.apk"
          echo "APK_FILE=$NAME.apk" >> "$GITHUB_ENV"
      - name: Sign APK (stable key, created automatically on the first build)
        env:
          KEY_B64: ${{ secrets.SIGN_KEY_B64 }}
          CERT_B64: ${{ secrets.SIGN_CERT_B64 }}
        run: |
          SD=.github/signing
          if [ -f "$SD/key.b64" ] && [ -f "$SD/cert.b64" ]; then
            KEY_B64=$(cat "$SD/key.b64"); CERT_B64=$(cat "$SD/cert.b64")
          fi
          if [ -z "$KEY_B64" ] || [ -z "$CERT_B64" ]; then
            echo "No signing key yet: creating one and saving it in the repository"
            openssl genrsa -out "$RUNNER_TEMP/k.pem" 2048 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/k.pem" -out "$RUNNER_TEMP/new.pk8" -nocrypt
            openssl req -new -x509 -key "$RUNNER_TEMP/k.pem" -sha256 -days 10950 -subj "/CN=$(basename "$GITHUB_REPOSITORY")" -outform DER -out "$RUNNER_TEMP/new.der"
            KEY_B64=$(base64 -w0 "$RUNNER_TEMP/new.pk8"); CERT_B64=$(base64 -w0 "$RUNNER_TEMP/new.der")
            mkdir -p "$SD"; echo "$KEY_B64" > "$SD/key.b64"; echo "$CERT_B64" > "$SD/cert.b64"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$SD/key.b64" "$SD/cert.b64"
            git commit -m "Add app signing key" && git push || echo "::warning::Could not save the signing key; the next build may use a different key"
          fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/key.pk8"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.der"
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          if "$AS" sign --key "$RUNNER_TEMP/key.pk8" --cert "$RUNNER_TEMP/cert.der" --out "$RUNNER_TEMP/signed.apk" "$APK_FILE" && "$AS" verify "$RUNNER_TEMP/signed.apk"; then
            mv "$RUNNER_TEMP/signed.apk" "$APK_FILE"
            echo "APK signed with the stable key"
          else
            echo "::warning::Signing failed, keeping the debug signature"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ${{ github.event.repository.name }} v${{ github.run_number }}
          files: ${{ env.APK_FILE }}
